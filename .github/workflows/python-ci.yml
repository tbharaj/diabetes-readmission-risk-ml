name: Repository Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -f LICENSE
          test -d src
          test -d outputs
          test -d docs
          test -f CONTRIBUTING.md
          echo "Repository structure check passed."
